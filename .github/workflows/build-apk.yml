name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Setup Capacitor and Android Platform
        run: |
          npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixel-music-player-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Release Metadata and Assets
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/PixelMusicPlayer.apk
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "RELEASE_NAME=Pixel Music Player ${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=latest" >> $GITHUB_ENV
            echo "RELEASE_NAME=Pixel Music Player - Latest Build (#${{ github.run_number }})" >> $GITHUB_ENV
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            ## 🎵 Pixel Music Player - Download APK Android

            Nuova versione compilata automaticamente da GitHub Actions.

            ### 📲 Come scaricare e installare:
            1. Clicca sul file **`PixelMusicPlayer.apk`** qui sotto nella sezione **Assets**.
            2. Il download dell'APK partirà direttamente (anche dal browser del tuo smartphone).
            3. Tocca il file scaricato per installare **Pixel Music Player**.

            ---
            - **Build**: #${{ github.run_number }}
            - **Commit**: `${{ github.sha }}`
            - **Piattaforma**: Android 8.0+ (Material You)
          files: |
            release-assets/PixelMusicPlayer.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
