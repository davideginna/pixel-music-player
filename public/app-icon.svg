<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ambient Shadow for App Container -->
    <filter id="appIconShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1A202C" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1A202C" flood-opacity="0.08" />
    </filter>

    <!-- Earbud Drop Shadow -->
    <filter id="earbudShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E293B" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1E293B" flood-opacity="0.12" />
    </filter>

    <!-- Google 4-Color Gradients -->
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#2B6CB0" />
    </linearGradient>

    <linearGradient id="gRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335" />
      <stop offset="100%" stop-color="#C53030" />
    </linearGradient>

    <linearGradient id="gYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBC04" />
      <stop offset="100%" stop-color="#D69E2E" />
    </linearGradient>

    <linearGradient id="gGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#276749" />
    </linearGradient>

    <!-- Subtle White Porcelain Earbud Gradient -->
    <linearGradient id="earbudMatte" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Earbud Stem / Body Dark Contrast (Pixel Buds Charcoal) -->
    <linearGradient id="earbudBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Silicone Tip Gradient -->
    <linearGradient id="siliconeTip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Inner Disc Shadow/Gleam -->
    <radialGradient id="discGleam" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#F1F5F9" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.6" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Canvas (Modern Google Icon Standard) -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="108"
    ry="108"
    fill="#FFFFFF"
    filter="url(#appIconShadow)"
  />

  <!-- Subtle Rim Highlight -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="108"
    ry="108"
    fill="none"
    stroke="#E2E8F0"
    stroke-width="2"
    opacity="0.8"
  />

  <!-- Google Signature Dynamic Soundwaves (Material 3 Acoustic Waves) -->
  <g transform="translate(0, 0)" opacity="0.95">
    <!-- Blue Soundwave (Top-Left) -->
    <path
      d="M 120 180 A 130 130 0 0 1 200 100"
      fill="none"
      stroke="url(#gBlue)"
      stroke-width="16"
      stroke-linecap="round"
    />
    <path
      d="M 155 195 A 90 90 0 0 1 210 140"
      fill="none"
      stroke="url(#gBlue)"
      stroke-width="12"
      stroke-linecap="round"
      opacity="0.75"
    />

    <!-- Red Soundwave (Top-Right) -->
    <path
      d="M 312 100 A 130 130 0 0 1 392 180"
      fill="none"
      stroke="url(#gRed)"
      stroke-width="16"
      stroke-linecap="round"
    />
    <path
      d="M 302 140 A 90 90 0 0 1 357 195"
      fill="none"
      stroke="url(#gRed)"
      stroke-width="12"
      stroke-linecap="round"
      opacity="0.75"
    />

    <!-- Yellow Soundwave (Bottom-Left) -->
    <path
      d="M 120 332 A 130 130 0 0 0 200 412"
      fill="none"
      stroke="url(#gYellow)"
      stroke-width="16"
      stroke-linecap="round"
    />
    <path
      d="M 155 317 A 90 90 0 0 0 210 372"
      fill="none"
      stroke="url(#gYellow)"
      stroke-width="12"
      stroke-linecap="round"
      opacity="0.75"
    />

    <!-- Green Soundwave (Bottom-Right) -->
    <path
      d="M 392 332 A 130 130 0 0 1 312 412"
      fill="none"
      stroke="url(#gGreen)"
      stroke-width="16"
      stroke-linecap="round"
    />
    <path
      d="M 357 317 A 90 90 0 0 1 302 372"
      fill="none"
      stroke="url(#gGreen)"
      stroke-width="12"
      stroke-linecap="round"
      opacity="0.75"
    />
  </g>

  <!-- Left Pixel Bud (Tilted Earbud with Silicone Tip) -->
  <g filter="url(#earbudShadow)" transform="translate(196, 256) rotate(-18) translate(-196, -256)">
    <!-- Silicone In-Ear Tip -->
    <ellipse cx="150" cy="225" rx="34" ry="24" transform="rotate(-35, 150, 225)" fill="url(#siliconeTip)" />
    <!-- Earbud Stem / Base Joint -->
    <rect x="156" y="215" width="46" height="42" rx="14" fill="url(#earbudBase)" transform="rotate(-15, 175, 235)" />
    <!-- Spatial Vent & Microphone Grille -->
    <circle cx="178" cy="228" r="3.5" fill="#475569" />

    <!-- Iconic Pixel Buds Round Touch Disc -->
    <circle cx="210" cy="256" r="62" fill="url(#earbudMatte)" />
    <circle cx="210" cy="256" r="62" fill="url(#discGleam)" />
    <circle cx="210" cy="256" r="61" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Google G Color Accent Ribbon / Touch Sensor Ring -->
    <circle cx="210" cy="256" r="36" fill="none" stroke="#F1F5F9" stroke-width="6" />
    <path
      d="M 210 220 A 36 36 0 0 1 246 256"
      fill="none"
      stroke="#4285F4"
      stroke-width="5"
      stroke-linecap="round"
    />
    <circle cx="210" cy="256" r="8" fill="#4285F4" opacity="0.9" />
  </g>

  <!-- Right Pixel Bud (Tilted Earbud with Silicone Tip) -->
  <g filter="url(#earbudShadow)" transform="translate(316, 256) rotate(18) translate(-316, -256)">
    <!-- Silicone In-Ear Tip -->
    <ellipse cx="362" cy="225" rx="34" ry="24" transform="rotate(35, 362, 225)" fill="url(#siliconeTip)" />
    <!-- Earbud Stem / Base Joint -->
    <rect x="310" y="215" width="46" height="42" rx="14" fill="url(#earbudBase)" transform="rotate(15, 335, 235)" />
    <!-- Spatial Vent & Microphone Grille -->
    <circle cx="334" cy="228" r="3.5" fill="#475569" />

    <!-- Iconic Pixel Buds Round Touch Disc -->
    <circle cx="302" cy="256" r="62" fill="url(#earbudMatte)" />
    <circle cx="302" cy="256" r="62" fill="url(#discGleam)" />
    <circle cx="302" cy="256" r="61" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Google Red Accent Ribbon / Touch Sensor Ring -->
    <circle cx="302" cy="256" r="36" fill="none" stroke="#F1F5F9" stroke-width="6" />
    <path
      d="M 302 220 A 36 36 0 0 1 338 256"
      fill="none"
      stroke="#EA4335"
      stroke-width="5"
      stroke-linecap="round"
    />
    <circle cx="302" cy="256" r="8" fill="#EA4335" opacity="0.9" />
  </g>

  <!-- Center Harmonizing Music Dot Indicator (Pixel Buds Audio Connection) -->
  <circle cx="256" cy="358" r="6" fill="#34A853" />
  <circle cx="256" cy="358" r="14" fill="none" stroke="#34A853" stroke-width="2" opacity="0.35" />
</svg>
