<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131314" />
      <stop offset="50%" stop-color="#1E1F20" />
      <stop offset="100%" stop-color="#2D2E30" />
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="50%" stop-color="#9B72CF" />
      <stop offset="100%" stop-color="#D96570" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#28292A" />
      <stop offset="100%" stop-color="#1E1F20" />
    </linearGradient>
    <filter id="phoneShadow" x="220" y="20" width="360" height="450" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="200" r="180" fill="#4285F4" opacity="0.12" filter="blur(80px)" />
  <circle cx="500" cy="260" r="160" fill="#9B72CF" opacity="0.12" filter="blur(80px)" />

  <!-- Branding Badge (Left Side) -->
  <g transform="translate(60, 160)">
    <rect width="180" height="34" rx="17" fill="#28292A" stroke="#3C4043" stroke-width="1"/>
    <circle cx="18" cy="17" r="6" fill="#8AB4F8"/>
    <text x="32" y="22" fill="#E8EAED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Material You 3.0</text>
    
    <text x="0" y="70" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">Pixel Music</text>
    <text x="0" y="98" fill="#8AB4F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Android Player</text>
    
    <text x="0" y="130" fill="#9AA0A6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" line-height="18">
      <tspan x="0" dy="0">• Dynamic Color theming</tspan>
      <tspan x="0" dy="18">• Local IndexedDB storage</tspan>
      <tspan x="0" dy="18">• Waveform Audio Engine</tspan>
      <tspan x="0" dy="18">• GitHub Actions CI/CD</tspan>
    </text>
  </g>

  <!-- Center Mobile Phone Mockup -->
  <g filter="url(#phoneShadow)">
    <!-- Phone Outer Body -->
    <rect x="270" y="30" width="260" height="420" rx="36" fill="#1E1F20" stroke="#3C4043" stroke-width="3"/>
    
    <!-- Camera Punch Hole -->
    <circle cx="400" cy="48" r="6" fill="#000000" stroke="#28292A" stroke-width="1.5"/>

    <!-- Screen Content -->
    <g transform="translate(282, 64)">
      <!-- Top Bar: App Title & Tab Indicator -->
      <text x="12" y="18" fill="#E8EAED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">In Riproduzione</text>
      <rect x="180" y="6" width="44" height="18" rx="9" fill="#3C4043"/>
      <text x="192" y="18" fill="#8AB4F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">FLAC</text>

      <!-- Center Album Art (Vinyl Style with Gemini gradient) -->
      <rect x="28" y="38" width="180" height="180" rx="24" fill="url(#geminiGrad)" />
      <!-- Vinyl record inner grooves -->
      <circle cx="118" cy="128" r="70" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="8 4"/>
      <circle cx="118" cy="128" r="50" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
      <circle cx="118" cy="128" r="30" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
      <circle cx="118" cy="128" r="16" fill="#1E1F20" stroke="#FFFFFF" stroke-width="2"/>

      <!-- Song Title & Artist -->
      <text x="12" y="244" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Pixel Horizon (Lo-Fi)</text>
      <text x="12" y="260" fill="#9AA0A6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Google Sound Lab • Material Vol. 1</text>
      <!-- Heart Icon Indicator -->
      <path d="M214 246 C214 242, 222 242, 222 248 C222 254, 214 258, 214 258 C214 258, 206 254, 206 248 C206 242, 214 242, 214 246 Z" fill="#EF4444"/>

      <!-- Waveform Progress Bar -->
      <rect x="12" y="278" width="212" height="6" rx="3" fill="#3C4043"/>
      <rect x="12" y="278" width="124" height="6" rx="3" fill="#8AB4F8"/>
      <circle cx="136" cy="281" r="5" fill="#8AB4F8"/>

      <text x="12" y="296" fill="#9AA0A6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">1:42</text>
      <text x="206" y="296" fill="#9AA0A6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">3:18</text>

      <!-- Player Controls -->
      <g transform="translate(18, 310)">
        <!-- Shuffle -->
        <circle cx="14" cy="20" r="12" fill="transparent"/>
        <path d="M8 16 L14 16 L18 24 L22 24" stroke="#9AA0A6" stroke-width="1.8" stroke-linecap="round"/>
        
        <!-- Prev -->
        <path d="M58 20 L70 12 L70 28 Z" fill="#E8EAED"/>
        <rect x="52" y="12" width="2.5" height="16" rx="1" fill="#E8EAED"/>

        <!-- Play Circle -->
        <circle cx="100" cy="20" r="22" fill="#8AB4F8"/>
        <path d="M96 13 L108 20 L96 27 Z" fill="#131314"/>

        <!-- Next -->
        <path d="M130 12 L142 20 L130 28 Z" fill="#E8EAED"/>
        <rect x="145" y="12" width="2.5" height="16" rx="1" fill="#E8EAED"/>

        <!-- Repeat -->
        <circle cx="186" cy="20" r="12" fill="transparent"/>
        <path d="M178 20 A6 6 0 1 1 190 20" stroke="#9AA0A6" stroke-width="1.8" fill="none"/>
      </g>

      <!-- Bottom Nav Bar (Material 3 pill indicators) -->
      <g transform="translate(10, 362)">
        <rect x="0" y="0" width="216" height="24" rx="12" fill="#131314"/>
        <rect x="12" y="4" width="40" height="16" rx="8" fill="#8AB4F8" opacity="0.25"/>
        <circle cx="32" cy="12" r="3" fill="#8AB4F8"/>
        <circle cx="84" cy="12" r="3" fill="#9AA0A6"/>
        <circle cx="134" cy="12" r="3" fill="#9AA0A6"/>
        <circle cx="184" cy="12" r="3" fill="#9AA0A6"/>
      </g>
    </g>
  </g>

  <!-- Right Features List Badge -->
  <g transform="translate(560, 150)">
    <rect width="180" height="200" rx="20" fill="url(#cardGrad)" stroke="#3C4043" stroke-width="1"/>
    <text x="20" y="32" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">🎨 Temi Inclusi</text>
    
    <g transform="translate(20, 48)">
      <circle cx="6" cy="6" r="6" fill="#8AB4F8"/>
      <text x="20" y="10" fill="#E8EAED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Gemini Aurora</text>

      <circle cx="6" cy="28" r="6" fill="#90CAF9"/>
      <text x="20" y="32" fill="#E8EAED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Pixel Blue (Bay)</text>

      <circle cx="6" cy="50" r="6" fill="#A8DAB5"/>
      <text x="20" y="54" fill="#E8EAED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Mint Forest</text>

      <circle cx="6" cy="72" r="6" fill="#FFB7B2"/>
      <text x="20" y="76" fill="#E8EAED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Coral & Rose</text>

      <circle cx="6" cy="94" r="6" fill="#FFE082"/>
      <text x="20" y="98" fill="#E8EAED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Amber Sunset</text>

      <circle cx="6" cy="116" r="6" fill="#E0E0E0"/>
      <text x="20" y="120" fill="#E8EAED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Obsidian Pure</text>
    </g>
  </g>
</svg>
